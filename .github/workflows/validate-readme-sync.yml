name: Validate README is in sync with entries.yml

# Fails a PR if someone edited data/entries.yml without regenerating README.md,
# or hand-edited the generated section of README.md without touching the YAML.

on:
  pull_request:
    paths:
      - "data/entries.yml"
      - "README.md"
      - "scripts/generate_readme.py"

jobs:
  check-readme-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate README and diff against committed version
        run: |
          python scripts/generate_readme.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md is out of sync with data/entries.yml. Run 'python scripts/generate_readme.py' and commit the result."
            git diff -- README.md
            exit 1
          fi
